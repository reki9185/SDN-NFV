services:
  onos:
    image: onosproject/onos:2.7-latest
    container_name: onos
    hostname: onos
    privileged: true
    environment:
      - ONOS_APPS=drivers,openflow,gui2,route-service,fpm
    ports:
      - "2620:2620"
      - "6653:6653"
      - "8101:8101"
      - "8181:8181"
    tty: true
    stdin_open: true
  
  h1:
    image: host
    container_name: h1
    privileged: true
    build:
      context: .
      dockerfile: host.Dockerfile
    cap_add:
      - NET_ADMIN
      - NET_BROADCAST
    entrypoint: ["/bin/sh","-c"]
    command:
    - |
      ip route del default 
      ip route add default via 172.16.4.1
      ip route -6 add default via 2a0b:4e07:c4:4::1
      sleep infinity


  h2:
    image: host
    container_name: h2
    privileged: true
    build:
      context: .
      dockerfile: host.Dockerfile
    cap_add:
      - NET_ADMIN
      - NET_BROADCAST
    entrypoint: ["/bin/sh","-c"]
    command:
    - |
      ip route del default 
      ip route add default via 172.17.4.1
      ip route -6 add default via 2a0b:4e07:c4:104::1
      sleep infinity

  R1:
    image: frrouting/frr-debian
    container_name: R1
    hostname: R1
    privileged: true
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
      - net.ipv6.conf.all.autoconf=0
    cap_add:
      - NET_ADMIN
      - NET_BROADCAST
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config/daemons:/etc/frr/daemons
      - ./config/R1/frr.conf:/etc/frr/frr.conf
  
  R2:
    image: frrouting/frr-debian
    container_name: R2
    hostname: R2
    privileged: true
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
      - net.ipv6.conf.all.autoconf=0
    cap_add:
      - NET_ADMIN
      - NET_BROADCAST
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config/daemons:/etc/frr/daemons
      - ./config/R2/frr.conf:/etc/frr/frr.conf

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.10.0.0/16